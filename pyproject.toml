[project]
name = "dram-benchmark"
version = "0.2.0"
description = "DRAM Benchmarking Platform — reproducible model card benchmarking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC BY 4.0" }
authors = [{ name = "DRAM Benchmarking Platform" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
sobol = ["SALib>=1.4.7"]

[project.scripts]
dram-bench = "dram_benchmark.cli:main"
dram-device = "bench.cli:main"
dram-validate = "validation.cli:main"
dram-sense-amp = "sense_amp.cli:main"
dram-ccell = "ccell.cli:main"
dram-pareto = "pareto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/dram_benchmark",
    "src/bench",
    "src/validation",
    "src/sense_amp",
    "src/ccell",
    "src/pareto",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ngspice: requires ngspice with BSIM-CMG OSDI",
    "spectre: requires Cadence Spectre",
    "hspice: requires Synopsys HSPICE",
    "integration: full simulator integration",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
